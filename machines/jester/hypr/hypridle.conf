# Nix-managed. The hand-edited ~/.config/hypr/hypridle.conf drifted from
# what these Nix-built scripts expect, so hypridle kept calling stale paths
# and the resume-relock fix was silently inert. lock_cmd below
# calls swaylock from the system profile.
general {
    lock_cmd = /run/current-system/sw/bin/flock -n $XDG_RUNTIME_DIR/swaylock.lock /run/current-system/sw/bin/swaylock -f -c 202020  # flock: atomic single instance (forked swaylock inherits the lock fd); pidof raced and spawned two lockers that fought over fprintd
    before_sleep_cmd = loginctl lock-session    # lock session before suspend.
    ignore_dbus_inhibit = false                 # whether to ignore dbus-sent idle-inhibit requests (used by e.g. firefox or steam)
    ignore_systemd_inhibit = false              # whether to ignore systemd-inhibit --what=idle inhibitors
}

listener {
    timeout = 60                                 # seconds
    on-timeout = sh -c '[ "$(brightnessctl g)" -gt 10 ] && brightnessctl -s set 10'   # dim to 10, saving prior value; guard avoids overwriting the saved value with 10 if already dimmed.
    on-resume  = brightnessctl -r                                                      # restore to exactly what it was (no-op if nothing saved); never jumps to full.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 30                                          # seconds
    on-timeout = /run/current-system/sw/bin/brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = /run/current-system/sw/bin/brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}

listener {
    timeout = 30                                          # seconds
    on-timeout = /run/current-system/sw/bin/presence-lock # grabs the webcam briefly; locks early if nobody is there, otherwise a no-op
    on-resume  = /run/current-system/sw/bin/touch $XDG_RUNTIME_DIR/presence-lock.resumed  # user activity during the check => skip the lock
}

listener {
    timeout = 120                                 # seconds; stays as a fallback regardless of presence-lock's outcome above
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 300                                 # 5.5min
    on-timeout = hyprctl dispatch dpms off        # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && ~/.config/hypr/restart-waybar.sh &  # screen on + restart waybar
}

listener {
    timeout = 3600                                # 60min
    on-timeout = ~/.config/hypr/maybe-suspend.sh  # suspend unless working (SSH, claude, build, load>0.8)
}
